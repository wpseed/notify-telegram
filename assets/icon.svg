<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
	<!-- The plugin's admin menu icon: a notification bell, not another speech bubble.
	     WordPress renders this file as a base64 data URI in a `.wp-menu-image.svg` background image
	     and never recolours it, so the two colours below are what the sidebar shows in every admin
	     colour scheme: the Telegram blue tile carries the plugin's own identity, the white bell stays
	     readable on the dark sidebar and on the blue highlight of the open screen alike. -->
	<rect width="24" height="24" rx="6" fill="#229ED9"/>
	<path d="M12 4.9c-2.7 0-4.9 2.2-4.9 4.9v3.3c0 .5-.2 1-.5 1.4l-1.1 1.4c-.5.7 0 1.7.9 1.7h11.2c.9 0 1.4-1 .9-1.7l-1.1-1.4c-.3-.4-.5-.9-.5-1.4V9.8c0-2.7-2.2-4.9-4.9-4.9Z" fill="#ffffff"/>
	<circle cx="12" cy="19.1" r="1.6" fill="#ffffff"/>
</svg>
